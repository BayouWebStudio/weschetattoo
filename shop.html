  <style>
    
    :root {
      --black: #0e0a0a;
      --charcoal: #1a1212;
      --gold: #2b58bf;
      --white: #e8d8d8;
      --dim: #e8d8d899;
      --border: #383030;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      line-height: 1.6;
      overflow-x: hidden;
    }
    /* NAV */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 48px;
      background: rgba(10,5,5,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo {
      font-family: 'DM Serif Display', serif;
      font-size: 1.3rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      color: var(--white);
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 32px; list-style: none; align-items: center; }
    .nav-links a {
      color: var(--dim);
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--white); }
    .lang-toggle {
      background: none;
      border: 1px solid var(--border);
      color: var(--dim);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 6px 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lang-toggle:hover { border-color: var(--gold); color: var(--gold); }
    .hamburger { display: none; background: none; border: none; cursor: pointer; padding: 4px; }
    .hamburger span { display: block; width: 22px; height: 1px; background: var(--white); margin: 5px 0; transition: all 0.3s; }
    .hamburger.open span:nth-child(1) { transform: rotate(45deg) translate(4px, 4px); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: rotate(-45deg) translate(4px, -4px); }
    .mobile-menu {
      display: none; position: fixed; top: 65px; left: 0; right: 0; z-index: 99;
      background: var(--charcoal); padding: 24px 48px; border-bottom: 1px solid var(--border);
    }
    .mobile-menu.open { display: block; }
    .mobile-menu a { display: block; color: var(--white); text-decoration: none; font-size: 0.85rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 12px 0; border-bottom: 1px solid var(--border); }
    /* FLOATING BOOK */
    .book-float {
      position: fixed; bottom: 32px; right: 32px; z-index: 200;
      background: var(--gold); color: #000;
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase;
      text-decoration: none; padding: 14px 22px; border-radius: 2px;
      box-shadow: 0 4px 24px rgba(201,168,76,0.35);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .book-float:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(201,168,76,0.5); }
    /* FADE-UP ANIMATIONS */
    .fade-up { opacity: 0; transform: translateY(28px); transition: opacity 0.7s ease, transform 0.7s ease; }
    .fade-up.visible { opacity: 1; transform: translateY(0); }
    /* FOOTER */
    footer {
      background: var(--charcoal); padding: 48px 72px;
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .footer-logo { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 1.1rem; color: var(--dim); }
    .footer-links { display: flex; gap: 24px; }
    .footer-links a { color: var(--dim); text-decoration: none; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; transition: color 0.2s; }
    .footer-links a:hover { color: var(--white); }
    .footer-copy { color: var(--dim); font-size: 0.72rem; }
    /* SHARED */
    .section-label { font-size: 0.68rem; letter-spacing: 0.24em; text-transform: uppercase; color: var(--gold); margin-bottom: 16px; }
    h2 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(2rem, 4vw, 3.2rem);
      font-weight: 400; line-height: 1.1; margin-bottom: 24px;
    }
    .btn-gold {
      display: inline-block; background: var(--gold); color: #000;
      text-decoration: none; font-size: 0.72rem; letter-spacing: 0.18em;
      text-transform: uppercase; padding: 16px 40px;
      transition: opacity 0.2s;
    }
    .btn-gold:hover { opacity: 0.88; }
    .btn-outline {
      display: inline-block; border: 1px solid var(--border); color: var(--white);
      text-decoration: none; font-size: 0.72rem; letter-spacing: 0.18em;
      text-transform: uppercase; padding: 14px 36px;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-outline:hover { border-color: var(--gold); color: var(--gold); }
    /* MOBILE */
    @media (max-width: 900px) {
      nav { padding: 18px 24px; } .nav-links { display: none; } .hamburger { display: block; }
      footer { flex-direction: column; gap: 24px; padding: 40px 24px; text-align: center; }
    }
    @media (max-width: 600px) {
      footer { padding: 32px 20px; }
    }
  
    /* HERO */
    .hero {
      min-height: 100vh; display: flex; align-items: flex-end;
      padding: 0 72px 80px; position: relative; overflow: hidden;
    }
    .hero-bg {
      position: absolute; inset: 0;
      background-image: url('img/hero-bg.webp');
      background-size: cover; background-position: center top;
      filter: brightness(0.42); transform: scale(1.02);
    }
    .hero-gradient {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(5,5,5,0.95) 0%, rgba(5,5,5,0.15) 55%, transparent 100%);
    }
    .hero-content { position: relative; z-index: 2; max-width: 700px; }
    .hero-eyebrow { font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); margin-bottom: 16px; }
    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(3.5rem, 8vw, 7rem);
      font-weight: 300; line-height: 0.95; letter-spacing: -0.01em; margin-bottom: 20px;
    }
    .hero-sub { font-size: 0.92rem; color: var(--dim); letter-spacing: 0.06em; margin-bottom: 40px; max-width: 480px; line-height: 1.7; }
    .hero-cta {
      display: inline-block; border: 1px solid var(--gold); color: var(--gold);
      text-decoration: none; font-size: 0.72rem; letter-spacing: 0.18em;
      text-transform: uppercase; padding: 14px 32px; transition: background 0.2s, color 0.2s;
    }
    .hero-cta:hover { background: var(--gold); color: #000; }
    .social-row { display: flex; gap: 16px; margin-top: 32px; }
    .social-row a { color: var(--dim); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none; transition: color 0.2s; }
    .social-row a:hover { color: var(--gold); }
    /* ABOUT PREVIEW */
    .about-preview { background: var(--charcoal); padding: 96px 72px; }
    .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 72px; align-items: center; max-width: 1200px; margin: 0 auto; }
    .about-text p { color: var(--dim); line-height: 1.8; margin-bottom: 20px; font-size: 0.95rem; }
    .about-img { width: 100%; aspect-ratio: 3/4; object-fit: cover; filter: brightness(0.85); transition: filter 0.3s; }
    .about-img:hover { filter: brightness(1); }
    .stats-row { display: flex; gap: 48px; margin-top: 40px; }
    .stat-num { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 2.4rem; font-weight: 300; color: var(--gold); }
    .stat-label { font-size: 0.7rem; color: var(--dim); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 4px; }
    .about-link { display: inline-block; margin-top: 32px; color: var(--gold); text-decoration: none; font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; border-bottom: 1px solid var(--gold); padding-bottom: 2px; transition: opacity 0.2s; }
    .about-link:hover { opacity: 0.7; }
    /* GALLERY PREVIEW */
    .gallery-section { padding: 96px 72px; background: var(--black); }
    .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; max-width: 1200px; margin: 0 auto 48px; }
    .gallery-item { aspect-ratio: 1; overflow: hidden; }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.85); transition: filter 0.4s, transform 0.4s; display: block; }
    .gallery-item:hover img { filter: brightness(1); transform: scale(1.04); }
    .gallery-cta-wrap { text-align: center; }
    /* BOOKING PREVIEW */
    .booking-preview { background: var(--charcoal); padding: 96px 72px; text-align: center; }
    .booking-preview h2 { max-width: 560px; margin: 0 auto 20px; }
    .booking-preview p { color: var(--dim); max-width: 480px; margin: 0 auto 36px; font-size: 0.95rem; }
    /* TESTIMONIALS PREVIEW */
    .testimonials-preview { padding: 96px 72px; background: var(--black); }
    .testimonials-preview .inner { max-width: 700px; margin: 0 auto; }
    .testimonial-placeholder { border: 1px solid var(--border); padding: 48px; text-align: center; }
    .testimonial-placeholder p { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 1.2rem; font-style: italic; color: var(--dim); margin-bottom: 8px; }
    .testimonial-placeholder small { color: var(--dim); font-size: 0.75rem; letter-spacing: 0.06em; }
    /* MOBILE */
    @media (max-width: 900px) {
      .hero { padding: 0 24px 60px; }
      .about-preview, .gallery-section, .booking-preview, .testimonials-preview { padding: 72px 24px; }
      .about-grid { grid-template-columns: 1fr; gap: 40px; }
      .gallery-grid { grid-template-columns: repeat(2, 1fr); }
      .stats-row { gap: 28px; }
      h1 { font-size: clamp(3rem, 10vw, 6rem); }
    }
    @media (max-width: 480px) {
      .gallery-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<style>
  /* Store grid */
  .shop-section { padding: 96px 24px; max-width: 1100px; margin: 0 auto; }
  .store-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; margin-top: 32px; }
  .store-card { background: var(--charcoal, #141414); border: 1px solid var(--border, #222); border-radius: 12px; overflow: hidden; transition: border-color 0.2s, transform 0.2s; }
  .store-card:hover { border-color: var(--gold, #C9A84C); transform: translateY(-2px); }
  .store-card-img { width: 100%; aspect-ratio: 1; object-fit: cover; background: rgba(255,255,255,0.03); }
  .store-card-body { padding: 16px; }
  .store-card-name { font-size: 1rem; font-weight: 600; color: var(--white, #e8e0d0); margin-bottom: 4px; }
  .store-card-desc { font-size: 0.8rem; color: var(--dim, #999); margin-bottom: 8px; line-height: 1.4; max-height: 2.8em; overflow: hidden; }
  .store-card-price { font-size: 1.1rem; font-weight: 700; color: var(--gold, #C9A84C); }
  .store-card-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .store-empty { text-align: center; padding: 60px 20px; color: var(--dim, #999); }
  .store-loading { text-align: center; padding: 60px 20px; color: var(--dim, #999); }
  .store-sold-out { opacity: 0.5; pointer-events: none; }
  .store-badge { display: inline-block; font-size: 0.65rem; padding: 2px 8px; border-radius: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .store-badge-sold-out { background: rgba(255,0,0,0.15); color: #ff6b6b; }
  /* Quantity selector */
  .qty-row { display: flex; align-items: center; gap: 4px; margin-bottom: 10px; }
  .qty-btn { width: 32px; height: 32px; border: 1px solid var(--border, #333); background: transparent; color: var(--white, #e8e0d0); font-size: 1.1rem; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: border-color 0.2s; }
  .qty-btn:hover { border-color: var(--gold, #C9A84C); }
  .qty-input { width: 40px; text-align: center; background: transparent; border: 1px solid var(--border, #333); color: var(--white, #e8e0d0); font-size: 0.85rem; border-radius: 6px; padding: 4px 0; -moz-appearance: textfield; }
  .qty-input::-webkit-outer-spin-button, .qty-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  /* Button pair */
  .btn-pair { display: flex; gap: 8px; }
  .btn-add-cart { flex: 1; padding: 10px 12px; background: var(--gold, #C9A84C); color: #000; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; border: none; border-radius: 4px; cursor: pointer; transition: opacity 0.2s; text-align: center; }
  .btn-add-cart:hover { opacity: 0.85; }
  .btn-add-cart:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-buy-now { flex: 1; padding: 10px 12px; background: transparent; color: var(--gold, #C9A84C); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid var(--gold, #C9A84C); border-radius: 4px; cursor: pointer; transition: opacity 0.2s, background 0.2s; text-align: center; }
  .btn-buy-now:hover { background: rgba(201,168,76,0.08); }
  .btn-buy-now:disabled { opacity: 0.5; cursor: not-allowed; }
  /* Floating cart icon */
  .cart-float { position: fixed; bottom: 90px; right: 32px; z-index: 900; width: 56px; height: 56px; border-radius: 50%; background: var(--gold, #C9A84C); border: none; cursor: pointer; display: none; align-items: center; justify-content: center; box-shadow: 0 4px 24px rgba(201,168,76,0.35); transition: transform 0.2s, box-shadow 0.2s; }
  .cart-float:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(201,168,76,0.5); }
  .cart-float.visible { display: flex; }
  .cart-float svg { width: 24px; height: 24px; fill: none; stroke: #000; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .cart-badge { position: absolute; top: -4px; right: -4px; background: #e74c3c; color: #fff; font-size: 0.65rem; font-weight: 700; min-width: 20px; height: 20px; border-radius: 10px; display: flex; align-items: center; justify-content: center; padding: 0 5px; }
  /* Cart drawer */
  .cart-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
  .cart-backdrop.open { opacity: 1; pointer-events: auto; }
  .cart-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 400px; max-width: 100vw; background: var(--charcoal, #141414); border-left: 1px solid var(--border, #222); z-index: 1001; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.3s ease; }
  .cart-drawer.open { transform: translateX(0); }
  .cart-header { padding: 20px 24px; border-bottom: 1px solid var(--border, #222); display: flex; align-items: center; justify-content: space-between; }
  .cart-header h3 { margin: 0; font-size: 1rem; font-weight: 600; color: var(--white, #e8e0d0); }
  .cart-close { background: none; border: none; color: var(--dim, #999); font-size: 1.4rem; cursor: pointer; padding: 4px; line-height: 1; }
  .cart-close:hover { color: var(--white, #e8e0d0); }
  .cart-body { flex: 1; overflow-y: auto; padding: 16px 24px; }
  .cart-empty { text-align: center; padding: 40px 0; color: var(--dim, #999); font-size: 0.85rem; }
  .cart-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border, #222); }

  .cart-item-name { font-size: 0.85rem; font-weight: 600; color: var(--white, #e8e0d0); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cart-item-price { font-size: 0.8rem; color: var(--dim, #999); }
  .cart-item-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .cart-item-total { font-size: 0.85rem; font-weight: 700; color: var(--gold, #C9A84C); }
  .cart-item-remove { background: none; border: none; color: var(--dim, #999); font-size: 0.7rem; cursor: pointer; text-decoration: underline; }
  .cart-item-remove:hover { color: #ff6b6b; }
  .cart-item-qty { display: flex; align-items: center; gap: 4px; }
  .cart-item-qty button { width: 26px; height: 26px; border: 1px solid var(--border, #333); background: transparent; color: var(--white, #e8e0d0); font-size: 0.9rem; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .cart-item-qty span { font-size: 0.8rem; color: var(--white, #e8e0d0); min-width: 20px; text-align: center; }
  .cart-footer { border-top: 1px solid var(--border, #222); padding: 20px 24px; }
  .cart-totals { margin-bottom: 16px; }
  .cart-total-line { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--dim, #999); margin-bottom: 6px; }
  .cart-total-grand { display: flex; justify-content: space-between; font-size: 1rem; font-weight: 700; color: var(--white, #e8e0d0); padding-top: 8px; border-top: 1px solid var(--border, #222); margin-top: 8px; }
  .cart-checkout-btn { width: 100%; padding: 14px; background: var(--gold, #C9A84C); color: #000; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; border: none; border-radius: 4px; cursor: pointer; transition: opacity 0.2s; }
  .cart-checkout-btn:hover { opacity: 0.85; }
  .cart-checkout-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .cart-continue { display: block; text-align: center; margin-top: 10px; font-size: 0.75rem; color: var(--dim, #999); cursor: pointer; background: none; border: none; text-decoration: underline; }
  /* Toast */
  .shop-toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: 8px; font-size: 0.82rem; font-weight: 500; z-index: 2000; opacity: 0; transition: opacity 0.3s; pointer-events: none; max-width: 90vw; text-align: center; }
  .shop-toast.visible { opacity: 1; }
  .shop-toast.success { background: rgba(16,185,129,0.9); color: #fff; }
  .shop-toast.error { background: rgba(239,68,68,0.9); color: #fff; }
  .shop-toast.info { background: rgba(201,168,76,0.9); color: #000; }
  @media (max-width: 600px) {
    .store-grid { grid-template-columns: 1fr; }
    .shop-section { padding: 72px 16px; }
    .cart-drawer { width: 100vw; }
    .cart-float { bottom: 80px; right: 16px; }
  }
</style>

    <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
    <span id="cart-badge" class="cart-badge" style="display:none;">0</span>
  </button>

  <div id="cart-backdrop" class="cart-backdrop"></div>
  <div id="cart-drawer" class="cart-drawer">
    <div class="cart-header">
      <h3 id="cart-title">Your Cart</h3>
      <button id="cart-close" class="cart-close">&times;</button>
    </div>
    <div id="cart-body" class="cart-body">
      <div class="cart-empty">Your cart is empty.</div>
    </div>
    <div class="cart-footer">
      <div id="cart-totals" class="cart-totals"></div>
      <button id="cart-checkout-btn" class="cart-checkout-btn" disabled>Checkout</button>
      <button id="cart-continue" class="cart-continue">Continue Shopping</button>
      <div style="font-size:0.7rem;color:var(--dim,#999);text-align:center;margin-top:8px;">Prices verified at checkout</div>
    </div>
  </div>

  <footer>
    <div class="footer-logo">Raul Wesche</div>
    <div class="footer-links">
      <a href="./index.html">Home</a>
      <a href="./about.html">About</a>
      <a href="./tattoos.html">Tattoos</a>
      <a href="./booking.html">Booking</a>
      <a href="https://www.instagram.com/weschetattoo" target="_blank" rel="noopener">Instagram</a>
      
    </div>
    <div class="footer-copy">&#xa9; 2026 Raul Wesche</div>
  </footer>

<script>
(function() {
  var SLUG = 'weschetattoo';
  var API = 'https://curious-lemming-262.convex.site';

  function esc(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  var toastEl = document.getElementById('shop-toast');
  var toastTimer = null;
  function showToast(msg, type) {
    if (toastTimer) clearTimeout(toastTimer);
    toastEl.textContent = msg;
    toastEl.className = 'shop-toast ' + (type || 'info') + ' visible';
    toastTimer = setTimeout(function() { toastEl.classList.remove('visible'); }, 5000);
  }

  var CART_KEY = 'eterno_cart_' + SLUG;
  var cartItems = [];
  function cartLoad() { try { cartItems = JSON.parse(localStorage.getItem(CART_KEY) || '[]'); } catch(e) { cartItems = []; } }
  function cartSave() { localStorage.setItem(CART_KEY, JSON.stringify(cartItems)); }
  function cartAdd(product, qty) {
    var found = false;
    for (var i = 0; i < cartItems.length; i++) {
      if (cartItems[i].priceId === product.stripePriceId) { cartItems[i].quantity += qty; found = true; break; }
    }
    if (!found) {
      cartItems.push({ priceId: product.stripePriceId, stripeAccountId: product.stripeAccountId || '', name: product.name, price: product.price, shippingCost: product.shippingCost || 0, imageUrl: product.imageUrl || '', quantity: qty });
    }
    cartSave(); renderCartBadge();
  }
  function cartRemove(priceId) { cartItems = cartItems.filter(function(i) { return i.priceId !== priceId; }); cartSave(); }
  function cartUpdateQty(priceId, qty) {
    if (qty < 1) { cartRemove(priceId); return; }
    for (var i = 0; i < cartItems.length; i++) { if (cartItems[i].priceId === priceId) { cartItems[i].quantity = qty; break; } }
    cartSave();
  }
  function cartCount() { var n = 0; for (var i = 0; i < cartItems.length; i++) n += cartItems[i].quantity; return n; }
  function cartSubtotal() { var t = 0; for (var i = 0; i < cartItems.length; i++) t += cartItems[i].price * cartItems[i].quantity; return t; }
  function cartShipping() { var t = 0; for (var i = 0; i < cartItems.length; i++) t += (cartItems[i].shippingCost || 0) * cartItems[i].quantity; return t; }
  function cartClear() { cartItems = []; cartSave(); }
  function fmtPrice(cents) { return '$' + (cents / 100).toFixed(2); }

  var floatBtn = document.getElementById('cart-float');
  var badgeEl = document.getElementById('cart-badge');
  var backdrop = document.getElementById('cart-backdrop');
  var drawer = document.getElementById('cart-drawer');
  var cartBody = document.getElementById('cart-body');
  var cartTotals = document.getElementById('cart-totals');
  var checkoutBtn = document.getElementById('cart-checkout-btn');
  var cartTitleEl = document.getElementById('cart-title');

  function renderCartBadge() {
    var c = cartCount();
    if (c > 0) { floatBtn.classList.add('visible'); badgeEl.style.display = ''; badgeEl.textContent = c; }
    else { floatBtn.classList.remove('visible'); badgeEl.style.display = 'none'; }
  }
  function renderCartDrawer() {
    cartTitleEl.textContent = 'Your Cart (' + cartCount() + ')';
    if (!cartItems.length) {
      cartBody.innerHTML = '<div class="cart-empty">Your cart is empty.</div>';
      cartTotals.innerHTML = '';
      checkoutBtn.disabled = true;
      return;
    }
    checkoutBtn.disabled = false;
    var html = '';
    for (var i = 0; i < cartItems.length; i++) {
      var it = cartItems[i];
      var imgHtml = it.imageUrl ? '<img class="cart-item-img" src="' + it.imageUrl + '" alt="">' : '<div class="cart-item-img" style="display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:var(--dim);">&#128722;</div>';
      html += '<div class="cart-item">' + imgHtml +
        '<div class="cart-item-info"><div class="cart-item-name">' + it.name + '</div><div class="cart-item-price">' + fmtPrice(it.price) + ' each</div>' +
        '<div class="cart-item-qty"><button data-action="minus" data-pid="' + it.priceId + '">&#8722;</button><span>' + it.quantity + '</span><button data-action="plus" data-pid="' + it.priceId + '">+</button></div></div>' +
        '<div class="cart-item-right"><div class="cart-item-total">' + fmtPrice(it.price * it.quantity) + '</div>' +
        '<button class="cart-item-remove" data-action="remove" data-pid="' + it.priceId + '">Remove</button></div></div>';
    }
    cartBody.innerHTML = html;
    var sub = cartSubtotal(); var ship = cartShipping();
    cartTotals.innerHTML = '<div class="cart-total-line"><span>Subtotal</span><span>' + fmtPrice(sub) + '</span></div>' +
      '<div class="cart-total-line"><span>Shipping</span><span>' + (ship > 0 ? fmtPrice(ship) : 'Free') + '</span></div>' +
      '<div class="cart-total-grand"><span>Total</span><span>' + fmtPrice(sub + ship) + '</span></div>';
  }
  function openCart() { backdrop.classList.add('open'); drawer.classList.add('open'); renderCartDrawer(); }
  function closeCart() { backdrop.classList.remove('open'); drawer.classList.remove('open'); }

  floatBtn.onclick = openCart;
  backdrop.onclick = closeCart;
  document.getElementById('cart-close').onclick = closeCart;
  document.getElementById('cart-continue').onclick = closeCart;

  cartBody.addEventListener('click', function(e) {
    var btn = e.target.closest('[data-action]');
    if (!btn) return;
    var action = btn.getAttribute('data-action');
    var pid = btn.getAttribute('data-pid');
    if (action === 'minus') { for (var i = 0; i < cartItems.length; i++) { if (cartItems[i].priceId === pid) { cartUpdateQty(pid, cartItems[i].quantity - 1); break; } } }
    else if (action === 'plus') { for (var i = 0; i < cartItems.length; i++) { if (cartItems[i].priceId === pid) { cartUpdateQty(pid, cartItems[i].quantity + 1); break; } } }
    else if (action === 'remove') { cartRemove(pid); }
    renderCartBadge(); renderCartDrawer();
  });

  checkoutBtn.onclick = function() {
    if (!cartItems.length) return;
    checkoutBtn.disabled = true; checkoutBtn.textContent = 'Processing...';
    var acctId = cartItems[0].stripeAccountId;
    var items = cartItems.map(function(it) { return { priceId: it.priceId, quantity: it.quantity, shippingCost: it.shippingCost || 0 }; });
    fetch(API + '/api/store/checkout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ items: items, stripeAccountId: acctId, slug: SLUG }) })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.url) window.location.href = d.url;
      else { showToast(d.error || 'Checkout unavailable', 'error'); checkoutBtn.disabled = false; checkoutBtn.textContent = 'Checkout'; }
    })
    .catch(function() { showToast('Network error. Please try again.', 'error'); checkoutBtn.disabled = false; checkoutBtn.textContent = 'Checkout'; });
  };

  var grid = document.getElementById('store-grid');
  var allProducts = [];
  fetch(API + '/api/store/inventory?slug=' + SLUG)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      allProducts = (data.products || []).filter(function(p) { return p.active; });
      if (!allProducts.length) { grid.innerHTML = '<div class="store-empty">No products available yet.</div>'; return; }
      grid.innerHTML = '';
      allProducts.forEach(function(p) {
        var soldOut = p.soldOut || false;
        var imgHtml = p.imageUrl ? '<img class="store-card-img" src="' + p.imageUrl + '" alt="' + esc(p.name) + '">' : '<div class="store-card-img" style="display:flex;align-items:center;justify-content:center;font-size:3rem;color:var(--dim);">&#128722;</div>';
        var priceStr = fmtPrice(p.price);
        var badgeHtml = soldOut ? '<span class="store-badge store-badge-sold-out">Sold Out</span>' : '';
        var card = document.createElement('div');
        card.className = 'store-card' + (soldOut ? ' store-sold-out' : '');
        card.innerHTML = imgHtml +
          '<div class="store-card-body">' +
            '<div class="store-card-name">' + esc(p.name) + '</div>' +
            (p.description ? '<div class="store-card-desc">' + esc(p.description) + '</div>' : '') +
            '<div class="store-card-meta"><div class="store-card-price">' + priceStr + '</div>' + badgeHtml + '</div>' +
            (!soldOut ? '<div class="qty-row"><button class="qty-btn" data-qty-action="minus" data-pid="' + p.stripePriceId + '">&#8722;</button><input class="qty-input" type="number" min="1" value="1" data-qty-input="' + p.stripePriceId + '"><button class="qty-btn" data-qty-action="plus" data-pid="' + p.stripePriceId + '">+</button></div>' : '') +
            '<div class="btn-pair"><button class="btn-add-cart" ' + (soldOut ? 'disabled' : '') + ' data-add-cart="' + p.stripePriceId + '">Add to Cart</button><button class="btn-buy-now" ' + (soldOut ? 'disabled' : '') + ' data-buy-now="' + p.stripePriceId + '">Buy Now</button></div>' +
          '</div>';
        grid.appendChild(card);
      });

      grid.addEventListener('click', function(e) {
        var btn = e.target.closest('[data-qty-action]');
        if (!btn) return;
        var pid = btn.getAttribute('data-pid');
        var input = grid.querySelector('[data-qty-input="' + pid + '"]');
        if (!input) return;
        var val = parseInt(input.value) || 1;
        if (btn.getAttribute('data-qty-action') === 'minus' && val > 1) input.value = val - 1;
        else if (btn.getAttribute('data-qty-action') === 'plus') input.value = val + 1;
      });

      grid.addEventListener('click', function(e) {
        var btn = e.target.closest('[data-add-cart]');
        if (!btn || btn.disabled) return;
        var pid = btn.getAttribute('data-add-cart');
        var input = grid.querySelector('[data-qty-input="' + pid + '"]');
        var qty = input ? parseInt(input.value) || 1 : 1;
        var product = null;
        for (var i = 0; i < allProducts.length; i++) { if (allProducts[i].stripePriceId === pid) { product = allProducts[i]; break; } }
        if (!product) return;
        cartAdd(product, qty);
        var orig = btn.textContent; btn.textContent = 'Added!'; btn.disabled = true;
        setTimeout(function() { btn.textContent = orig; btn.disabled = false; }, 1200);
        showToast(esc(product.name) + ' added to cart', 'info');
      });

      grid.addEventListener('click', function(e) {
        var btn = e.target.closest('[data-buy-now]');
        if (!btn || btn.disabled) return;
        var pid = btn.getAttribute('data-buy-now');
        var input = grid.querySelector('[data-qty-input="' + pid + '"]');
        var qty = input ? parseInt(input.value) || 1 : 1;
        var product = null;
        for (var i = 0; i < allProducts.length; i++) { if (allProducts[i].stripePriceId === pid) { product = allProducts[i]; break; } }
        if (!product) return;
        btn.disabled = true; btn.textContent = 'Processing...';
        fetch(API + '/api/store/checkout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ items: [{ priceId: pid, quantity: qty, shippingCost: product.shippingCost || 0 }], stripeAccountId: product.stripeAccountId || '', slug: SLUG }) })
        .then(function(r) { return r.json(); })
        .then(function(d) {
          if (d.url) window.location.href = d.url;
          else { showToast(d.error || 'Checkout unavailable', 'error'); btn.disabled = false; btn.textContent = 'Buy Now'; }
        })
        .catch(function() { showToast('Network error', 'error'); btn.disabled = false; btn.textContent = 'Buy Now'; });
      });
    })
    .catch(function() { grid.innerHTML = '<div class="store-empty">Could not load products.</div>'; });

  if (window.location.search.indexOf('payment=success') !== -1) {
    cartClear(); renderCartBadge();
    showToast('Payment successful! Thank you for your order.', 'success');
    if (window.history && window.history.replaceState) window.history.replaceState({}, '', window.location.pathname);
  }

  cartLoad(); renderCartBadge();

  // Sync cart across tabs
  window.addEventListener('storage', function(e) {
    if (e.key === CART_KEY) {
      cartLoad(); renderCartBadge();
      if (drawer.classList.contains('open')) renderCartDrawer();
    }
  });
})();
</script>
<!-- LIGHTBOX -->
  <div id="lightbox-overlay" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.95);align-items:center;justify-content:center;cursor:zoom-out;" onclick="if(event.target===this)closeLightbox()">
    <button onclick="closeLightbox()" style="position:absolute;top:20px;right:24px;background:none;border:none;color:#fff;font-size:2.2rem;cursor:pointer;z-index:10001;line-height:1;padding:8px;" aria-label="Close">&times;</button>
    <button id="lb-prev" onclick="lbNav(-1);event.stopPropagation()" style="position:absolute;left:16px;top:50%;transform:translateY(-50%);background:none;border:none;color:#fff;font-size:2.5rem;cursor:pointer;z-index:10001;padding:12px;opacity:0.7;" aria-label="Previous">&#8249;</button>
    <button id="lb-next" onclick="lbNav(1);event.stopPropagation()" style="position:absolute;right:16px;top:50%;transform:translateY(-50%);background:none;border:none;color:#fff;font-size:2.5rem;cursor:pointer;z-index:10001;padding:12px;opacity:0.7;" aria-label="Next">&#8250;</button>
    <img id="lb-img" src="" alt="" style="max-width:92vw;max-height:92vh;object-fit:contain;user-select:none;-webkit-user-drag:none;transition:opacity 0.2s;" onclick="event.stopPropagation()">
  </div>
  <script>
  (function(){
    var lbOverlay=document.getElementById('lightbox-overlay'),lbImg=document.getElementById('lb-img'),lbImages=[],lbIdx=0,touchX=0;
    function collectImages(){
      lbImages=[];
      document.querySelectorAll('.gallery-item img, .masonry-item img').forEach(function(img,i){
        lbImages.push(img.src);
        img.style.cursor='zoom-in';
        img.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();openLightbox(i);});
      });
    }
    function openLightbox(i){lbIdx=i;lbImg.src=lbImages[lbIdx];lbOverlay.style.display='flex';document.body.style.overflow='hidden';}
    function closeLB(){lbOverlay.style.display='none';document.body.style.overflow='';}
    function nav(d){lbIdx=(lbIdx+d+lbImages.length)%lbImages.length;lbImg.src=lbImages[lbIdx];}
    window.closeLightbox=closeLB;window.lbNav=nav;window.openLightbox=openLightbox;
    document.addEventListener('keydown',function(e){if(lbOverlay.style.display==='flex'){if(e.key==='Escape')closeLB();else if(e.key==='ArrowLeft')nav(-1);else if(e.key==='ArrowRight')nav(1);}});
    lbOverlay.addEventListener('touchstart',function(e){touchX=e.changedTouches[0].screenX;},{passive:true});
    lbOverlay.addEventListener('touchend',function(e){var dx=e.changedTouches[0].screenX-touchX;if(Math.abs(dx)>50){dx>0?nav(-1):nav(1);}},{passive:true});
    if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',collectImages);}else{collectImages();}
  })();
  </script>
  
  <script>
    const LANG = { default: 'en', current: document.documentElement.lang || 'en' };
    function toggleLang() {
      LANG.current = LANG.current === 'es' ? 'en' : 'es';
      document.documentElement.lang = LANG.current;
      document.querySelectorAll('[data-es][data-en]').forEach(el => {
        el.textContent = el.getAttribute('data-' + LANG.current) || el.textContent;
      });
      document.querySelectorAll('[data-es-href][data-en-href]').forEach(el => {
        el.setAttribute('href', el.getAttribute('data-' + LANG.current + '-href') || el.getAttribute('href'));
      });
      const btn = document.querySelector('.lang-toggle');
      if (btn) btn.textContent = LANG.current === 'es' ? 'EN' : 'ES';
    }
    // Apply language on page load based on html lang attribute
    document.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('[data-es][data-en]').forEach(el => {
        el.textContent = el.getAttribute('data-' + LANG.current) || el.textContent;
      });
      const btn = document.querySelector('.lang-toggle');
      if (btn) btn.textContent = LANG.current === 'es' ? 'EN' : 'ES';
    });

    // Fade-up on scroll
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
    }, { threshold: 0.12 });
    document.querySelectorAll('.fade-up').forEach(el => obs.observe(el));
  </script>
